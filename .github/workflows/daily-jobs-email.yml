name: Daily jobs email

on:
  schedule:
    # 22:30 UTC = 6:30 PM America/New_York during EDT (5:30 PM during EST).
    # Weekday evenings by the owner's request: mornings are interview prep,
    # the evening is the application block, so the digest arrives when the
    # work begins rather than twelve hours before it.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet reportlab

      - name: Send daily jobs digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
        run: python scripts/daily_jobs_email.py
