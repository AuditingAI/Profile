name: Daily jobs email

on:
  schedule:
    # 11:00 UTC = 07:00 America/New_York during EDT, 06:00 during EST.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet reportlab

      - name: Send daily jobs digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EXTRA_RECIPIENTS: ${{ secrets.EXTRA_RECIPIENTS }}
        run: python scripts/daily_jobs_email.py
