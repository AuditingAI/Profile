<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 46 256 252" role="img" aria-label="Audit the Algorithm">
  <title>Audit lens with wordmark</title>
  <!-- The audit lens. The original magnifier from the Audit the Algorithm site,
     with the tick replaced by the A from The Reference Mark: the lens stands
     in for the Reference Mark's open ring, and the A's crossbar still reaches
     toward the rim without closing on it. Navy #1B365D, orange #E0662E. -->
  <circle cx="149" cy="140" r="84" stroke="#1B365D" stroke-width="8.5" fill="none"/>
  <line x1="212" y1="203" x2="253" y2="244" stroke="#1B365D" stroke-width="12" stroke-linecap="round"/>
  <path d="M108.8 190.3 L149 98.1 L189.2 190.3" stroke="#E0662E" stroke-width="11" stroke-linejoin="miter" stroke-linecap="butt" fill="none"/>
  <path d="M112.5 160.1 H214.3" stroke="#E0662E" stroke-width="11" stroke-linecap="butt"/>
  <text x="150" y="286" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#1B365D" letter-spacing="0.3">AUDIT THE ALGORITHM</text>
</svg>
