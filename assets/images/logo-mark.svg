<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Audit the Algorithm">
  <title>Audit the Algorithm</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
  </defs>
  <g fill="url(#goldGrad)">
    <!-- left diagonal: the thin stroke -->
    <path d="M100,26 L30,162 L52,162 L100,44 Z"/>
    <!-- right diagonal: the thick stroke -->
    <path d="M100,26 L170,162 L140,162 L100,44 Z"/>
    <!-- foot serifs -->
    <path d="M14,162 L62,162 L62,174 L14,174 Z"/>
    <path d="M132,162 L186,162 L186,174 L132,174 Z"/>
    <!-- the crossbar, drawn as a hairline rule that runs clean through the
         letter and past both stems - the same rule that separates sections on
         the resume, so the mark and the document are one system -->
    <path d="M30,119 L170,119 L170,125 L30,125 Z"/>
  </g>
</svg>
