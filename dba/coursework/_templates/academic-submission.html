<!--
  Academic submission template — Yasir A. Malik
  House style from live.html: paper #FBFAF7 · ink #14171C · accent #1F4E79
  Type: Iowan Old Style / Palatino serif body · mono for the eyebrow rule

  USE: copy this file, replace the {{FIELDS}} and the <article> body,
  open in a browser, Print → Save as PDF. Margins are set for US Letter.

  The wordmark is the MONOCHROME variant (assets/images/logo-mono.svg), not the
  gold public logo. Class submissions get a restrained letterhead; the gold mark
  is for portfolio and public documents.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}} — Yasir A. Malik</title>
<style>
  :root{
    --paper:#FBFAF7; --ink:#14171C; --ink-2:#4A5058; --ink-3:#767D86;
    --rule:#D8D4CB; --accent:#1F4E79;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  @page{ size:letter; margin:0.9in; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--serif); font-size:11.5pt; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{max-width:6.7in;margin:0.9in auto;padding:0}
  header{border-bottom:2px solid var(--accent);padding-bottom:.55rem;margin-bottom:1.4rem}
  .mark{height:26px;display:block;margin:0 0 .7rem;opacity:.9}
  h1{font-family:var(--serif);font-size:15.5pt;font-weight:600;letter-spacing:-.01em;margin:0 0 .3rem}
  .meta{
    font-family:var(--mono); font-size:7.8pt; letter-spacing:.11em;
    text-transform:uppercase; color:var(--ink-3); margin:0;
  }
  article p{margin:0 0 .82rem;text-align:justify;hyphens:auto}
  article p:first-of-type{margin-top:0}
  blockquote{margin:0;font-style:italic}
  em{font-style:italic}
  footer{
    margin-top:1.5rem;padding-top:.5rem;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:7.6pt;line-height:1.5;color:var(--ink-3);
  }
  footer strong{color:var(--ink-2);font-weight:600}
  @media print{
    body{background:#fff}
    .sheet{margin:0;max-width:none}
  }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <img class="mark" src="../../../assets/images/logo-mono.svg" alt="Audit the Algorithm">
    <h1>{{TITLE}}</h1>
    <p class="meta">Yasir A. Malik &nbsp;·&nbsp; {{COURSE}} &nbsp;·&nbsp; {{INSTRUCTOR}} &nbsp;·&nbsp; {{DATE}}</p>
  </header>

  <article>
    <p>{{BODY}}</p>
  </article>

  <footer>
    <strong>AI use.</strong> {{DISCLOSURE}}
  </footer>

</div>
</body>
</html>
